# The fork's checks on PRs: formatting, Clippy (native and wasm) and the tests of the web app
# (shared editing) and the UI. Linux only: the fork ships the webxdc build, so the native print
# hosts on Windows and macOS aren't exercised here.
name: CI

on:
  pull_request:
    paths:
      - 'Cargo*'
      - 'apps/wordcraft-web/**'
      - 'crates/**'
      - '.github/workflows/ci.yml'
  push:
    branches: [webxdc]
    paths:
      - 'Cargo*'
      - 'apps/wordcraft-web/**'
      - 'crates/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build and software-rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev \
            libxi-dev libgtk-3-dev libfontconfig1-dev libfreetype-dev libvulkan1 mesa-vulkan-drivers

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/webxdc' }}

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy -p wordcraft-web -p wordcraft-ui-egui --all-targets --locked -- -D warnings

      - name: Clippy (wasm)
        run: cargo clippy -p wordcraft-web --target wasm32-unknown-unknown --locked -- -D warnings

      - name: Tests
        run: cargo test -p wordcraft-web -p wordcraft-ui-egui --locked
