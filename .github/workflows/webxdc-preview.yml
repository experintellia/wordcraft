# Builds the webxdc app for every pull request and posts a sticky comment linking the
# preview wordcraft.xdc, to drop into a Delta Chat chat.
name: webxdc preview

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write # sticky preview-build comment

concurrency:
  group: webxdc-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  xdc:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      TRUNK_VERSION: "0.21.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust (stable + wasm32)
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
          rustup default stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install trunk
        run: |
          curl -fsSL "https://github.com/trunk-rs/trunk/releases/download/v${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C /usr/local/bin trunk
          trunk --version

      - name: Build wordcraft.xdc
        run: |
          packaging/webxdc/package.sh
          . packaging/env.sh
          mkdir -p dist-xdc
          cp "$DIST/wordcraft-$VERSION.xdc" dist-xdc/wordcraft.xdc

      - name: Upload preview .xdc artifact
        id: upload_xdc
        uses: actions/upload-artifact@v4
        with:
          name: preview-xdc
          path: dist-xdc/wordcraft.xdc
          retention-days: 30

      - name: Post sticky PR comment with preview link
        # A pull request from another fork gets a read-only token: no comment, the artifact stays.
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: xdc-preview
          message: |
            ## 📦 Preview build ready

            [Download wordcraft.xdc](${{ steps.upload_xdc.outputs.artifact-url }}) and drop it into a Delta Chat chat to test this PR.
