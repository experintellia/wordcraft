# Builds the webxdc app (packaging/webxdc/package.sh) and attaches it to a GitHub Release as
# `wordcraft.xdc`. Fork releases are tagged `v<upstream version>-webxdc.<n>` (plain `v0.9.0` is
# upstream's tag): pushing such a tag, or creating a release with it, releases under that tag; a
# manual run takes the tag as input. A release's notes are the tag's section of CHANGELOG.md, also
# for one created in the GitHub UI with empty notes. An existing release gets its wordcraft.xdc
# replaced, built from the tag's own commit.
name: Release webxdc

on:
  push:
    tags: ["v*-webxdc.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.9.0-webxdc.1 (created on webxdc's head if new)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-webxdc-${{ github.ref }}
  cancel-in-progress: false

jobs:
  xdc:
    # A manual run releases only from the webxdc branch, never from an unreviewed branch.
    if: github.ref_type == 'tag' || github.ref == 'refs/heads/webxdc'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      TRUNK_VERSION: "0.21.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust (stable + wasm32)
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
          rustup default stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install trunk
        run: |
          curl -fsSL "https://github.com/trunk-rs/trunk/releases/download/v${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C /usr/local/bin trunk
          trunk --version

      - name: Build wordcraft.xdc
        run: |
          packaging/webxdc/package.sh
          . packaging/env.sh
          cp "$DIST/wordcraft-$VERSION.xdc" wordcraft.xdc

      - name: Publish to the release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then TAG="$GITHUB_REF_NAME"; else TAG="$INPUT_TAG"; fi
          case "$TAG" in v*-webxdc.*) ;; *) echo "::error::tag $TAG isn't v<version>-webxdc.<n>"; exit 1 ;; esac
          # A tag that exists already names its commit: a manual run from a later webxdc would attach
          # a different build to it.
          if TAGGED=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha 2>/dev/null) && [ "$TAGGED" != "$GITHUB_SHA" ]; then
            echo "::error::tag $TAG is at $TAGGED, not this run's $GITHUB_SHA: push the tag again, or use a new one"
            exit 1
          fi
          # The tag's section of CHANGELOG.md, without its heading.
          awk -v tag="$TAG" '/^## /{p = ($2 == tag); next} p' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "WordCraft as a webxdc app: send wordcraft.xdc to a Delta Chat chat; everyone who opens it edits the same document." > notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" wordcraft.xdc --clobber
            # Made in the GitHub UI with no notes: the changelog's.
            if [ -z "$(gh release view "$TAG" --json body -q .body)" ]; then
              gh release edit "$TAG" --notes-file notes.md
            fi
          else
            gh release create "$TAG" wordcraft.xdc --target "$GITHUB_SHA" \
              --title "WordCraft $TAG (webxdc)" --notes-file notes.md
          fi
