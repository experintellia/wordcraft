[package]
name = "wordcraft-web"
description = "WordCraft in the browser (eframe web runner, WebGL2)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "wordcraft-web"
path = "src/main.rs"

[features]
default = ["more-images"]
# WebP and TIFF pictures; the webxdc build (webxdc.html) leaves them out to stay small.
more-images = ["image/webp", "image/tiff"]

[dependencies]
image = { workspace = true }
wordcraft-engine = { workspace = true }
wordcraft-ui-egui = { workspace = true }
egui = { workspace = true }
log = { workspace = true }
serde_json = { workspace = true }
wordcraft-doc = { workspace = true }
wordcraft-fonts = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# glow (WebGL2), not wgpu: egui draws plain textured triangles, and wgpu's WebGPU setup and naga
# shader translator made the module bigger and the first frame later.
eframe = { workspace = true, features = ["default_fonts", "glow", "accesskit"] }
rfd = { workspace = true }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement", "HtmlAnchorElement", "HtmlIFrameElement", "Blob", "BlobPropertyBag", "Url", "Location", "CssStyleDeclaration", "Event", "EventTarget", "BeforeUnloadEvent", "ClipboardEvent", "DataTransfer", "FileList", "File", "DomStringList", "IdbFactory", "IdbOpenDbRequest", "IdbRequest", "IdbDatabase", "IdbObjectStore", "IdbTransaction", "IdbTransactionMode", "MediaQueryList", "Storage"] }
